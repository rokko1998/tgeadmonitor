services:
  monitor:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - lead-monitor-data:/app/data

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  lead-monitor-data: