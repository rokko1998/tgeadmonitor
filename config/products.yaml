# Товарные категории и услуги.
# Каждый товар/услуга — набор regex по НОРМАЛИЗОВАННОМУ тексту.
# Важно: сюда включены в основном достаточно однозначные формулировки,
# чтобы повышать recall без сильного роста false positive.

products:
  # ---------- Чёрный металлопрокат ----------

  - id: rebar
    name: "арматура"
    group: "металлопрокат"
    patterns:
      - '\bарматур\w*'
      - '\b(?:а|a)\s*500\s*(?:с|c)?\b'
      - '\b(?:а|a)\s*400\b'
      - '\b(?:а|a)\s*240\b'
      - '\b(?:а|a)[- ]?(?:i|ii|iii|1|3)\b(?=\s*(?:ф|d)?\s*\d{1,2}\b)'
    size_patterns:
      - '\bарматур\w*\s*(?:ф|d|диаметр(?:ом)?)?\s*(6|8|10|12|14|16|18|20|22|25|28|32|36|40)(?:\s*мм)?\b(?!\s*(?:м\b|метр|шт|тонн|т\b|кг))'
      - '\b(?:ф|d|диаметр(?:ом)?)\s*(6|8|10|12|14|16|18|20|22|25|28|32|36|40)(?:\s*мм)?\b'
      - '\b(6|8|10|12|14|16|18|20|22|25|28|32|36|40)[- ]?(?:ка|ку|кой)\b'

  - id: profile_pipe
    name: "профильная труба"
    group: "металлопрокат"
    patterns:
      - '\bпрофильн\w*\s+труб\w*'
      - '\bпроф\.?\s*труб\w*'
      - '\bпрофтруб\w*'
      - '\bпрофил[ье]к\w*'
      - '\bквадратн\w*\s+труб\w*'
      - '\bпрямоугольн\w*\s+труб\w*'
      - '\bпрофиль\s+\d{2,3}x\d{2,3}(?:x\d{1,2}(?:[.,]\d+)?)?\b'
      - '\bтруб\w*\s+\d{2,3}x\d{2,3}x\d{1,2}(?:[.,]\d+)?\b'
    size_patterns:
      - '\b(?:профильн\w*\s+труб\w*|проф\.?\s*труб\w*|профтруб\w*|профил[ье]к\w*|профиль)\s*(\d{2,3})x(\d{2,3})(?:x(\d{1,2}(?:[.,]\d+)?))?\b'
      - '\b(\d{2,3})x(\d{2,3})x(\d{1,2}(?:[.,]\d+)?)\b'

  - id: pipe
    name: "труба"
    group: "металлопрокат"
    patterns:
      - '\bтруб[аыуеой]?\b(?!\s+(?:пвх|пнд|канализац|пластик|полипропилен|гофр|дренажн|медн))'
      - '\bвгп\b'
      - '\bводогазопроводн\w*'
      - '\bэлектросварн\w*'
      - '\bбесшовн\w*\s+труб\w*'
      - '\bкругл\w*\s+труб\w*'
      - '\bтруб\w*\s+(?:стальн|металлическ|черн)\w*'
      - '\b(?:стальн|металлическ|черн)\w*\s+труб\w*'
    size_patterns:
      - '\bтруб\w*\s*(?:ф|d|диаметр(?:ом)?)?\s*(\d{2,3}(?:[.,]\d+)?)(?:\s*x\s*(\d{1,2}(?:[.,]\d+)?))?(?:\s*мм)?\b(?!\s*(?:м\b|метр|шт|тонн|т\b|кг))'
      - '\b(?:ф|d|диаметр(?:ом)?)\s*(\d{2,3}(?:[.,]\d+)?)(?:\s*x\s*(\d{1,2}(?:[.,]\d+)?))?(?:\s*мм)?\b'

  - id: sheet
    name: "лист стальной"
    group: "металлопрокат"
    patterns:
      - '\bлист\w*\s+(?:стальн|металл|гк|хк|горячекатан|холоднокатан|оцинкован|рифлен|рифлён|черн)\w*'
      - '\b(?:стальн|металлическ|горячекатан|холоднокатан|оцинкован|рифлен|рифлён|черн)\w*\s+лист\w*'
      - '\bлистов\w+\s+металл\w*'
      - '\bлист\s+\d{1,2}(?:[.,]\d+)?\s*мм\b'
      - '\bлист\s+\d{3,4}x\d{3,4}(?:x\d{1,2}(?:[.,]\d+)?)?\b'
      - '\bлист\s+\d{1,2}(?:[.,]\d+)?[- ]?(?:ка|мм)\b'
      - '\bлист\s+(?:ст3|09г2с|с255|с345|ст20|ст45)\b'
      - '\b(?:гк|хк)\s+лист\w*'
    size_patterns:
      - '\bлист\w*\s*(\d{1,2}(?:[.,]\d+)?)\s*мм\b'
      - '\bлист\w*\s*(\d{3,4})x(\d{3,4})(?:x(\d{1,2}(?:[.,]\d+)?))?\b'
      - '\b(\d{3,4})x(\d{3,4})x(\d{1,2}(?:[.,]\d+)?)\b'

  - id: angle
    name: "уголок"
    group: "металлопрокат"
    patterns:
      - '\bуголок\w*(?!\s+(?:пластик|пвх|для\s+плитки|керамич))'
      - '\bуголк\w*\s+(?:металл|стальн)\w*'
      - '\b(?:металл|стальн)\w*\s+уголк\w*'
      - '\bуголок\s+\d{2,3}x\d{2,3}(?:x\d{1,2})?\b'
    size_patterns:
      - '\bугол(?:ок|ка|ку|ком)\s*(\d{2,3})(?:x(\d{2,3}))?(?:x(\d{1,2}(?:[.,]\d+)?))?\b(?!\s*(?:м\b|метр|шт))'

  - id: channel
    name: "швеллер"
    group: "металлопрокат"
    patterns:
      - '\bшвеллер\w*'
      - '\bшвелер\w*'
    size_patterns:
      - '\bшвел+ер\w*\s*(\d{1,2})(?:\s*[- ]?\s*([пуаэ]))?\b(?!\s*(?:м\b|метр|шт))'

  - id: ibeam
    name: "двутавр"
    group: "металлопрокат"
    patterns:
      - '\bдвутавр\w*'
      - '\bдвутавров\w*\s+балк\w*'
      - '\bбалк\w*\s+двутавров\w*'
      - '\b(?:10|12|14|16|18|20|25|30|35|40|45|50|55|60)(?:б|b|ш|k|к)\d\b'
    size_patterns:
      - '\bдвутавр\w*\s*(\d{1,2})(?:\s*([бшкbkh])\s*(\d))?\b'
      - '\b((?:10|12|14|16|18|20|25|30|35|40|45|50|55|60)(?:б|b|ш|к|k)\d)\b'

  - id: mesh
    name: "сетка металлическая"
    group: "металлопрокат"
    patterns:
      - '\bсетк\w*\s+(?:сварн|кладочн|дорожн|строительн|оцинкован|рабиц|армирующ|металл|вр)\w*'
      - '\b(?:сварн|кладочн|дорожн|строительн|оцинкован|металлическ|армирующ)\w*\s+сетк\w*'
      - '\bрабиц\w*'
      - '\bсетк[аиуеой]?\s+\d{2,3}x\d{2,3}(?:x\d(?:[.,]\d+)?)?\b'
      - '\bсетк[аиуеой]?\b(?!\s+(?:москитн|оконн|маскировочн|футбольн|волейбольн|теннисн|рыболовн|затеняющ|пластиков))'
      - '\bвр[- ]?1\b(?=.*\bсетк)'
    size_patterns:
      - '\bсетк\w*\s*(\d{2,3})x(\d{2,3})(?:x(\d(?:[.,]\d+)?))?\b'
      - '\bячейк\w*\s*(\d{2,3})x(\d{2,3})\b'

  - id: wire
    name: "проволока"
    group: "металлопрокат"
    patterns:
      - '\bпроволок\w*'
      - '\bвязальн\w*\s+проволок\w*'
      - '\bпроволок\w*\s+вязальн\w*'
      - '\bоцинкованн\w*\s+проволок\w*'
      - '\bвр[- ]?1\b'
    size_patterns:
      - '\bпроволок\w*\s*(?:ф|d|диаметр(?:ом)?)?\s*(\d{1,2}(?:[.,]\d+)?)\s*(?:мм)?\b'
      - '\bвр[- ]?1\s*(\d(?:[.,]\d+)?)\b'

  - id: embedded_parts
    name: "закладные детали"
    group: "металлоконструкции"
    patterns:
      - '\bзакладн\w*\s+детал\w*'
      - '\bзакладн\w*\s+издели\w*'
      - '\bзакладн\w*\s+элемент\w*'
      - '\bзакладн\w*\s+пластин\w*'
      - '\bзакладн\w*\s+пластинк\w*'
      - '\bзакладн\w*\s+анкер\w*'
      - '\bзакладн\w*\s+для\s+(?:фундамент|колонн|опор|ворот|навес)\w*'

  - id: metal_structures
    name: "металлоконструкции"
    group: "металлоконструкции"
    patterns:
      - '\bметаллоконструкци\w*'
      - '\bметаллокаркас\w*'
      - '\bметалл\w*\s+каркас\w*'
      - '\bкаркас\w*\s+из\s+металл\w*'
      - '\bсварн\w*\s+металлоконструкци\w*'
      - '\bизготов\w*\s+металлоконструкци\w*'

  - id: profnastil
    name: "профнастил"
    group: "металлопрокат"
    patterns:
      - '\bпрофнастил\w*'
      - '\bпрофлист\w*'
      - '\bпрофилированн\w*\s+лист\w*'
      - '\b(?:профлист|профнастил)\s*(?:с|c|нс|hc|н|h)\s*\d{1,2}\b'
      - '\bметаллочерепиц\w*'

  - id: metal_generic
    name: "металлопрокат"
    group: "металлопрокат"
    patterns:
      - '\bметаллопрокат\w*'
      - '\bчерн\w*\s+металл\w*'
      - '\bчерн\w*\s+прокат\w*'
      - '\bстальн\w*\s+прокат\w*'
      - '\bпрокат\w*\s+сталь\w*'
      - '\bметалл(?:а|у|ом|е)?\b'
      - '\b(?:09г2с|с255|с345|ст3(?:сп|пс|кп)?|ст20|ст35|ст45)\b'

  - id: round_bar
    name: "круг стальной"
    group: "металлопрокат"
    patterns:
      - '\bстальн\w*\s+круг\w*'
      - '\bметаллическ\w*\s+круг\w*'
      - '\bкруг\s+стальн\w*'
      - '\bкруг\s+металлическ\w*'
      - '\bкруг\s*(?:ф|d|диаметр(?:ом)?)?\s*\d{1,3}(?:[.,]\d+)?\s*(?:мм)?\b'
      - '\bкруг\s+(?:ст20|ст35|ст45|09г2с)\b'
    size_patterns:
      - '\bкруг\w*\s*(?:ф|d|диаметр(?:ом)?)?\s*(\d{1,3}(?:[.,]\d+)?)\s*(?:мм)?\b'

  - id: square_bar
    name: "квадрат стальной"
    group: "металлопрокат"
    patterns:
      - '\bстальн\w*\s+квадрат\w*'
      - '\bметаллическ\w*\s+квадрат\w*'
      - '\bквадрат\s+стальн\w*'
      - '\bквадрат\s+металлическ\w*'
      - '\bквадрат\s+\d{1,3}\s*(?:мм)?\b'
      - '\bквадрат\s+(?:ст20|ст35|ст45)\b'
    size_patterns:
      - '\bквадрат\w*\s*(\d{1,3})\s*(?:мм)?\b'

  - id: flat_bar
    name: "полоса стальная"
    group: "металлопрокат"
    patterns:
      - '\bполос\w*\s+стальн\w*'
      - '\bполос\w*\s+металл\w*'
      - '\bстальн\w*\s+полос\w*'
      - '\bметаллическ\w*\s+полос\w*'
      - '\bполос[аыуеой]?\s+\d{2,3}x\d{1,2}(?:[.,]\d+)?\b'
    size_patterns:
      - '\bполос\w*\s*(\d{2,3})x(\d{1,2}(?:[.,]\d+)?)\b'

  - id: hexagon
    name: "шестигранник"
    group: "металлопрокат"
    patterns:
      - '\bшестигранник\w*'
      - '\bшестигранн\w*\s+сталь\w*'
      - '\bстальн\w*\s+шестигранник\w*'
    size_patterns:
      - '\bшестигранник\w*\s*(\d{1,3})\s*(?:мм)?\b'

  - id: expanded_metal
    name: "просечно-вытяжной лист"
    group: "металлопрокат"
    patterns:
      - '\bпвл\b'
      - '\bпвл[- ]?\d{3,4}\b'
      - '\bпросечно[- ]?вытяжн\w*\s+лист\w*'
      - '\bлист\w*\s+просечно[- ]?вытяжн\w*'
      - '\bпросечк\w*\s+металл\w*'

  - id: perforated_sheet
    name: "перфорированный лист"
    group: "металлопрокат"
    patterns:
      - '\bперфорированн\w*\s+лист\w*'
      - '\bлист\w*\s+перфорированн\w*'
      - '\bперфолист\w*'
      - '\bперфораци\w*\s+(?:лист|металл)\w*'

  - id: steel_coil
    name: "рулонная сталь"
    group: "металлопрокат"
    patterns:
      - '\bрулонн\w*\s+стал\w*'
      - '\bсталь\w*\s+в\s+рулон\w*'
      - '\bрулон\w*\s+(?:стал|металл|оцинковк)\w*'
      - '\bоцинковк\w*\s+в\s+рулон\w*'
      - '\bрулонн\w*\s+металл\w*'

  - id: strip
    name: "штрипс"
    group: "металлопрокат"
    patterns:
      - '\bштрипс\w*'
      - '\bстальн\w*\s+штрипс\w*'
      - '\bметаллическ\w*\s+штрипс\w*'
      - '\bстальн\w*\s+лент\w*'
      - '\bлент\w*\s+стальн\w*'

  - id: wire_rod
    name: "катанка"
    group: "металлопрокат"
    patterns:
      - '\bкатанк\w*'
    size_patterns:
      - '\bкатанк\w*\s*(?:ф|d)?\s*(\d{1,2}(?:[.,]\d+)?)\s*(?:мм)?\b'

  - id: steel_grating
    name: "решетчатый настил"
    group: "металлопрокат"
    patterns:
      - '\bрешетчат\w*\s+настил\w*'
      - '\bпрессованн\w*\s+настил\w*'
      - '\bсварн\w*\s+настил\w*'
      - '\bнастил\w*\s+(?:решетчат|прессованн)\w*'

  - id: bent_profile
    name: "гнутый профиль"
    group: "металлопрокат"
    patterns:
      - '\bгнут\w*\s+профил\w*'
      - '\bхолодногнут\w*\s+профил\w*'
      - '\bz[- ]?профил\w*'
      - '\bзет[- ]?профил\w*'
      - '\bc[- ]?профил\w*'
      - '\bсигма[- ]?профил\w*'
      - '\bомега[- ]?профил\w*'

  # ---------- Услуги по металлу ----------

  - id: plasma_cutting
    name: "плазменная резка"
    group: "услуги"
    patterns:
      - '\bплазменн\w*\s+резк\w*'
      - '\bрезк\w*\s+плазм\w*'
      - '\bплазморез\w*'
      - '\bплазм\w*\s+резк\w*\s+металл\w*'

  - id: laser_cutting
    name: "лазерная резка"
    group: "услуги"
    patterns:
      - '\bлазерн\w*\s+резк\w*'
      - '\bрезк\w*\s+лазер\w*'
      - '\bлазер\w*\s+по\s+металл\w*'
      - '\bлазерн\w*\s+раскро\w*'

  - id: guillotine_cutting
    name: "гильотинная резка"
    group: "услуги"
    patterns:
      - '\bгильотинн\w*\s+резк\w*'
      - '\bрезк\w*\s+гильотин\w*'
      - '\bрубк\w*\s+гильотин\w*'
      - '\bгильотин\w*\s+металл\w*'

  - id: cut_to_size
    name: "резка металла в размер"
    group: "услуги"
    patterns:
      - '\bрезк\w*\s+(?:металл\w*\s+)?в\s+размер\b'
      - '\bпорезк\w*\s+(?:металл|труб|арматур|профил|лист)\w*'
      - '\bнарезк\w*\s+(?:металл|труб|арматур|профил|лист)\w*'
      - '\bнарезать\s+(?:металл|труб|арматур|профил|лист)\w*'
      - '\bпорезать\s+(?:металл|труб|арматур|профил|лист)\w*'
      - '\bраскро[йя]\w*\s+(?:лист|металл)\w*'

  - id: metal_painting
    name: "покраска металлоконструкций"
    group: "услуги"
    patterns:
      - '\bпокраск\w*\s+металлоконструкци\w*'
      - '\bпокрасить\s+металлоконструкци\w*'
      - '\bпорошков\w*\s+покраск\w*\s+металл\w*'
      - '\bокраск\w*\s+металлоконструкци\w*'

  - id: fabrication_by_drawing
    name: "изготовление изделий по чертежу"
    group: "услуги"
    patterns:
      - '\bизготов\w*\s+(?:издели\w*\s+)?из\s+металл\w*\s+по\s+чертеж\w*'
      - '\bизготов\w*\s+по\s+чертеж\w*\s+(?:из\s+)?металл\w*'
      - '\bметаллоиздели\w*\s+по\s+чертеж\w*'
      - '\bдетал\w*\s+из\s+металл\w*\s+по\s+чертеж\w*'

  # ---------- Пиломатериалы ----------

  - id: lumber
    name: "пиломатериалы"
    group: "пиломатериалы"
    patterns:
      - '\bпиломатериал\w*'
      - '\bлесоматериал\w*'
      - '\bпиленн\w*\s+лес\w*'
      - '\bлес\s+(?:куб|кубов|м3|пиленн|обрезн)\w*'

  - id: edged_board
    name: "доска"
    group: "пиломатериалы"
    patterns:
      - '\bобрезн\w*\s+доск\w*'
      - '\bнеобрезн\w*\s+доск\w*'
      - '\bдоск\w*\s+обрезн\w*'
      - '\bдоск\w*\s+(?:соснов|хвойн|сух|строганн)\w*'
      - '\bдоск[аиуеой]?\s+\d{2,3}x\d{2,3}(?:x\d{3,4})?\b'
      - '\bдоск\w*\s+(?:25|30|40|50)[- ]?(?:ка|мм)\b'
    size_patterns:
      - '\bдоск\w*\s*(\d{2,3})x(\d{2,3})(?:x(\d{3,4}))?\b'

  - id: timber_beam
    name: "брус"
    group: "пиломатериалы"
    patterns:
      - '\bбрус\b'
      - '\bбрус[ауыом]+\b'
      - '\bбрус\s+\d{2,3}x\d{2,3}\b'
      - '\bстроганн\w*\s+брус\w*'
      - '\bклеен\w*\s+брус\w*'
    size_patterns:
      - '\bбрус\w*\s*(\d{2,3})x(\d{2,3})(?:x(\d{3,4}))?\b'

  - id: timber_batten
    name: "брусок"
    group: "пиломатериалы"
    patterns:
      - '\bбрусок\w*'
      - '\bбруск\w*\s+\d{1,3}x\d{1,3}\b'
      - '\bдеревянн\w*\s+брусок\w*'
    size_patterns:
      - '\bбруск\w*\s*(\d{1,3})x(\d{1,3})(?:x(\d{3,4}))?\b'

  - id: wooden_lath
    name: "рейка деревянная"
    group: "пиломатериалы"
    patterns:
      - '\bдеревянн\w*\s+рейк\w*'
      - '\bрейк\w*\s+деревянн\w*'
      - '\bрейк[аиуеой]?\s+\d{1,3}x\d{1,3}\b'
    size_patterns:
      - '\bрейк\w*\s*(\d{1,3})x(\d{1,3})(?:x(\d{3,4}))?\b'

# Строительный контекст — слабый признак.
# Здесь намеренно нет одиночных "гараж", "склад", "ангар":
# покупка готового объекта не должна выглядеть как строительный лид.
  # ---------- Инженерные работы ГидроМонтаж-Юг ----------

  - id: heating_service
    name: "отопление"
    group: "услуги"
    patterns:
      - '\bотоплен\w*'
      - '\bкотельн\w*'
      - '\bобвязк\w*\s+котл\w*'
      - '\b(?:монтаж\w*|установк\w*|ремонт\w*)\s+котл\w*'
      - '\b(?:монтаж\w*|установк\w*|замен\w*)\s+(?:радиатор\w*|конвектор\w*)'
      - '\bтепл\w*\s+пол\w*'
      - '\b(?:бойлер\w*|газов\w*\s+колонк\w*)'

  - id: water_supply_service
    name: "водоснабжение"
    group: "услуги"
    patterns:
      - '\bводоснабжен\w*'
      - '\bводопровод\w*'
      - '\bразводк\w*\s+вод\w*'
      - '\b(?:ввод|подвод|врезк\w*)\s+вод\w*'
      - '\b(?:провест\w*|подвест\w*|завест\w*)\s+вод\w*'

  - id: well_service
    name: "скважина на воду"
    group: "услуги"
    patterns:
      - '\bбурен\w*\s+скважин\w*'
      - '\bобвязк\w*\s+скважин\w*'
      - '\bкессон\w*'
      - '\b(?:монтаж\w*|установк\w*)\s+(?:кессон\w*|люк\w*\s+из\s+жб)'

  - id: water_treatment_service
    name: "водоочистка"
    group: "услуги"
    patterns:
      - '\bводоочистк\w*'
      - '\bводоподготовк\w*'
      - '\bумягчен\w*\s+вод\w*'
      - '\bочистк\w*\s+вод\w*'
      - '\bобратн\w*\s+осмос\w*'
      - '\bфильтр\w*(?:\s+\S+){0,2}\s+вод\w*'

  - id: sewer_service
    name: "канализация / септик"
    group: "услуги"
    patterns:
      - '\bканализац\w*'
      - '\bсептик\w*'
      - '\b(?:выгребн|переливн)\w*\s+ям\w*'
      - '\bфанов\w*\s+канализац\w*'
      - '\bсололифт\w*'
      - '\bфекальн\w*\s+насос\w*'
      - '\bпрочистк\w*\s+канализац\w*'

  - id: plumbing_service
    name: "сантехнические работы"
    group: "услуги"
    patterns:
      - '\bсантехник\w*'
      - '\bсантехническ\w*\s+работ\w*'
      - '\b(?:установк\w*|монтаж\w*|подключен\w*)\s+(?:раковин\w*|ванн\w*|унитаз\w*|биде|смесител\w*|полотенцесушител\w*)'
      - '\b(?:установк\w*|монтаж\w*|подключен\w*)\s+душев\w*\s+кабин\w*'

  - id: chimney_service
    name: "дымоходы и вытяжки"
    group: "услуги"
    patterns:
      - '\bдымоход\w*'
      - '\b(?:монтаж\w*|установк\w*)\s+вытяжк\w*'
      - '\bдымоотвод\w*'

  - id: repair_engineering_service
    name: "ремонт инженерных систем"
    group: "услуги"
    patterns:
      - '\bремонт\w*(?:\s+\S+){0,3}\s+(?:отоплен\w*|водоснабжен\w*|водопровод\w*|канализац\w*|котл\w*)'
      - '\bзамен\w*\s+стояк\w*'
      - '\bпусконаладочн\w*\s+работ\w*'

  - id: diamond_drilling_service
    name: "алмазное сверление"
    group: "услуги"
    patterns:
      - '\bалмазн\w*\s+(?:сверлен\w*|бурен\w*)'

  - id: trenchless_puncture_service
    name: "прокол"
    group: "услуги"
    patterns:
      - '\bпрокол\w*(?:\s+\S+){0,3}\s+(?:под\s+дорог\w*|грунт\w*|труб\w*|водопровод\w*)'
construction_context:
  - id: fence
    pattern: '\bзабор\w*'
  - id: canopy
    pattern: '\bнавес\w*'
  - id: gates
    pattern: '\bворот\w*|\bкалитк\w*'
  - id: frame
    pattern: '\bкаркас\w*'
  - id: welding
    pattern: '\bсварить\b|\bсварк\w*|\bзаварить\b|\bприварить\b|\bсварщик\w*'
  - id: foundation
    pattern: '\bфундамент\w*|\bармопояс\w*|\bперекрыти\w*|\bстяжк\w*'
  - id: roof
    pattern: '\bкровл\w*|\bкрыш\w*'
  - id: stairs_railings
    pattern: '\bметаллическ\w*\s+(?:лестниц|перил|ограждени)\w*|\b(?:лестниц|перил|ограждени)\w*\s+из\s+металл\w*'
  - id: truss
    pattern: '\bметаллическ\w*\s+ферм\w*|\bферм\w*\s+(?:для\s+)?навес\w*|\bстропильн\w*\s+ферм\w*'
  - id: build_object
    pattern: '\b(?:строю|строим|строить|строительств\w*)\s+(?:гараж|склад|ангар|пристройк)\w*|\bкаркас\w*\s+(?:гараж|склад|ангар)\w*|\bметалл\w*\s+(?:на|для)\s+(?:гараж|склад|ангар|пристройк)\w*'
  - id: construction
    pattern: '\bстройк\w*|\bстроительств\w*|\bстрою\b|\bстроим\b|\bстроить\b'

# Общие типоразмеры.
sizes:
  - '\b(\d{2,3})x(\d{2,3})x(\d{1,2}(?:[.,]\d+)?)\b'
  - '\b(\d{3,4})x(\d{3,4})x(\d{1,2}(?:[.,]\d+)?)\b'
  - '\b(\d{2,4})x(\d{1,3}(?:[.,]\d+)?)\b'
  - '\b(?:ф|d|диаметр(?:ом)?)\s*(\d{1,3}(?:[.,]\d+)?)\s*(?:мм)?\b'
  - '\b(?:толщин\w*|стенк\w*)\s*(\d{1,2}(?:[.,]\d+)?)\s*(?:мм)?\b'

amounts:
  - '\b(\d+(?:[.,]\d+)?)\s*(кг|килограмм\w*|тонн\w*|т|метр\w*|м|погонн\w*\s+метр\w*|п\s*м|шт|штук\w*|лист\w*|хлыст\w*|прут\w*|бухт\w*|рулон\w*|пач\w*|мешк\w*|куб\w*|м3|поддон\w*|палет\w*)\b'
  - '\b(тонн\w*|метр\w*|штук\w*|шт|лист\w*|хлыст\w*|прут\w*|бухт\w*|рулон\w*|кг|куб\w*|мешк\w*|поддон\w*|палет\w*)\s+(?:по\s+|около\s+|примерно\s+|где-то\s+)?(\d+(?:[.,]\d+)?)\b'
  - '\b(одн[ау]|один|дв[ае]|три|четыре|пять|шесть|семь|восемь|девять|десять|пятнадцать|двадцать|тридцать|сорок|пятьдесят|сто|пар[ау]?|несколько|пол\s*тонны|полтонны)\s+(тонн\w*|метр\w*|шт\w*|лист\w*|хлыст\w*|прут\w*|бухт\w*|рулон\w*|пач\w*|кг|килограмм\w*|мешк\w*|куб\w*|поддон\w*|палет\w*)\b'
