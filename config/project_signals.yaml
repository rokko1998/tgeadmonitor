# Professional/project signals tuned to current commercial priorities.
project_signals:
  - id: mesh_direct_context
    pattern: '\b(?:сетк\w*|вр[- ]?1|арматурн\w+\s+карт\w*)\b'
  - id: mesh_armoring
    pattern: '\b(?:армирован\w*|армировк\w*)\b(?:\s+\S+){0,6}\b(?:сетк\w*|ячейк\w*|карт\w*)\b'
  - id: mesh_cell
    pattern: '\bячейк\w*\s*(?:50|100|150|200)\s*[xх]\s*(?:50|100|150|200)\b'
  - id: slab_reinforcement
    pattern: '\b(?:плит\w*|стяжк\w*|фундамент\w*|отмостк\w*|бетонн\w+\s+площадк\w*|кладк\w*|армопояс\w*)\b(?:\s+\S+){0,8}\b(?:армир\w*|сетк\w*)\b'
  - id: monolith
    pattern: '\b(?:монолит\w*|ростверк\w*|армопояс\w*|фундаментн\w+\s+плит\w*)\b'
  - id: embedded_parts_project
    pattern: '\b(?:закладн\w+|анкерн\w+\s+групп\w*|опорн\w+\s+пластин\w*|фланц\w*)\b'
  - id: fabrication_drawings
    pattern: '\b(?:по\s+кмд|по\s+км\b|по\s+чертеж\w*|по\s+эскиз\w*)\b'
  - id: metal_structures_project
    pattern: '\b(?:металлоконструкци\w*|металлокаркас\w*|ангар\w*|ферм\w*|эстакад\w*|каркас\w+\s+из\s+металл\w*)\b'
  - id: fence_canopy_project
    pattern: '\b(?:навес\w*|забор\w*|ворот\w*|огражден\w*|лестниц\w*)\b(?:\s+\S+){0,6}\b(?:свар\w*|металл\w*|монтаж\w*|изготов\w*)\b'
  - id: metal_cutting_project
    pattern: '\b(?:резк\w*|раскро\w*|нарез\w*|порез\w*)\b(?:\s+\S+){0,5}\b(?:металл\w*|лист\w*|труб\w*|профил\w*|арматур\w*)\b'
  - id: plumbing_project
    pattern: '\b(?:сантехник\w*|сантехническ\w+\s+работ\w*|водоснабжен\w*|канализац\w*|водоотведен\w*|хвс\b|гвс\b|вк\b|трубопровод\w*)\b(?:\s+\S+){0,7}\b(?:монтаж\w*|объект\w*|систем\w*|работ\w*|подряд\w*|разводк\w*)\b'
  - id: heating_project
    pattern: '\b(?:отоплен\w*|котельн\w*|теплосет\w*|радиатор\w*|тепл\w+\s+пол\w*|бойлер\w*|конвектор\w*)\b(?:\s+\S+){0,7}\b(?:монтаж\w*|объект\w*|систем\w*|работ\w*|подряд\w*|установ\w*)\b'
  - id: ventilation_project
    pattern: '\b(?:овик\b|вентиляц\w*|воздуховод\w*|приточ\w*|вытяж\w*|венткамер\w*)\b(?:\s+\S+){0,7}\b(?:монтаж\w*|проект\w*|объект\w*|систем\w*|работ\w*|подряд\w*|обслуживан\w*)\b'
  - id: conditioning_project
    pattern: '\b(?:кондиционирован\w*|кондиционер\w*|фанкойл\w*|чиллер\w*|сплит[- ]?систем\w*)\b(?:\s+\S+){0,7}\b(?:монтаж\w*|проект\w*|объект\w*|систем\w*|работ\w*|подряд\w*|обслуживан\w*)\b'
  - id: new_project
    pattern: '\b(?:нов\w+\s+объект\w*|выходим\s+на\s+объект|заходим\s+на\s+объект|начинаем\s+(?:монолит|строительств\w*)|строительств\w+\s+(?:склад\w*|ангар\w*|цех\w*))\b'
  - id: need_crew
    pattern: '\b(?:нужн\w*|требу\w*|ищем)\b(?:\s+\S+){0,3}\b(?:бригад\w*|монолитчик\w*|сварщик\w*|монтажник\w*|сантехник\w*|вентиляционщик\w*)\b'

professional_actors:
  - id: foreman
    pattern: '\b(?:прораб\w*|начальник\w+\s+участк\w*|руководител\w+\s+проект\w*)\b'
  - id: procurement
    pattern: '\b(?:снабженец\w*|снабжени\w*|отдел\w+\s+снабжен\w*|закупщик\w*)\b'
  - id: contractor
    pattern: '\b(?:генподрядчик\w*|подрядчик\w*|субподрядчик\w*)\b'
  - id: crew
    pattern: '\b(?:монолитчик\w*|сварщик\w*|монтажник\w*|строител\w*|сантехник\w*|вентиляционщик\w*)\b'
