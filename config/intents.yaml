# Расширенный словарь покупательских намерений для Telegram-мониторинга.
#
# Принцип:
# - strong: true ставим только там, где формулировка достаточно явно означает
#   покупку / заказ / закупку / запрос поставщика / коммерческого предложения.
# - Обычные (не strong) intents дают +intent, но сами по себе не форсят lead.
# - Matcher отдельно игнорирует прямое отрицание перед совпадением: "не нужна", "не хочу купить".
# - Регулярки применяются к нормализованному тексту: lower-case, ё -> е, лишняя пунктуация убрана.
#
# ВАЖНО: не делаем strong слишком широким. Любой strong + product при отсутствии sell/ad
# может сработать как hard-rule lead.

purchase_intents:

  # ---------------------------------------------------------------------------
  # 1. БАЗОВАЯ ПОТРЕБНОСТЬ
  # ---------------------------------------------------------------------------

  - id: need
    pattern: '\bнужн(?:а|о|ы|ен)\b'

  - id: required
    pattern: '\b(?:требуется|требуются|необходим[оаы]?|потребуется|потребуются)\b'

  - id: urgent_need
    pattern: '\b(?:срочно|очень\s+срочно|как\s+можно\s+скорее)\b(?:\s+\S+){0,3}?\s+(?:нужн(?:а|о|ы|ен)|требуется|требуются|необходим[оаы]?)\b'

  - id: need_for_object
    pattern: '\b(?:на|для)\s+(?:объект\w*|стройк\w*|строительств\w*|ремонт\w*|монтаж\w*)\b(?:\s+\S+){0,4}?\s+(?:нужн(?:а|о|ы|ен)|требуется|требуются|необходим[оаы]?)\b'

  - id: looking_for
    pattern: '\b(?:ищу|ищем|разыскиваю|разыскиваем|ищется)\b'

  - id: looking_for_option
    pattern: '\b(?:ищу|ищем)\b(?:\s+\S+){0,3}?\s+(?:вариант|варианты|предложение|предложения)\b'

  # ---------------------------------------------------------------------------
  # 2. ПРЯМОЕ НАМЕРЕНИЕ КУПИТЬ / ЗАКАЗАТЬ
  # ---------------------------------------------------------------------------

  - id: need_buy
    pattern: '\b(?:надо|нужно|хочу|хотим|хотел\s+бы|хотела\s+бы|хотели\s+бы|хотелось\s+бы|планирую|планируем|собираюсь|собираемся|намерен|намерены)\s+(?:купить|приобрести|заказать|взять|закупить|докупить|дозаказать)\b'
    strong: true

  - id: buy
    pattern: '\b(?:куплю|купим|приобрету|приобретем|закажу|закажем|закуплю|закупим|возьму|возьмем|докуплю|докупим|дозакажу|дозакажем)\b'
    strong: true

  - id: would_buy
    pattern: '\b(?:купил|купила|купили|взял|взяла|взяли|заказал|заказала|заказали|приобрел|приобрела|приобрели)\s+бы\b'
    strong: true

  - id: ready_to_buy
    pattern: '\b(?:готов|готова|готовы)\s+(?:купить|приобрести|заказать|закупить|взять|забрать|оплатить)\b'
    strong: true

  - id: can_buy
    pattern: '\b(?:можно|возможно)\s+(?:ли\s+)?(?:купить|приобрести|заказать|взять|закупить)\b'
    strong: true

  - id: want_order
    pattern: '\b(?:хочу|хотим|хотел\s+бы|хотела\s+бы|хотели\s+бы)\s+(?:сделать|оформить)\s+заказ\b'
    strong: true

  - id: order_request
    pattern: '\b(?:оформлю|оформим|делаю|делаем)\s+заказ\b'
    strong: true

  - id: repeat_purchase
    pattern: '\b(?:докупить|докупим|докуплю|дозаказать|дозакажем|дозакажу|добрать|доберем|доберу)\b'
    strong: true

  - id: take_batch
    pattern: '\b(?:возьму|возьмем|беру|берем|готов(?:ы)?\s+взять)\b(?:\s+\S+){0,3}?\s+(?:парти\w*|объем\w*|тонн\w*|метр\w*|штук\w*)\b'
    strong: true

  # ---------------------------------------------------------------------------
  # 3. ЗАКУПКА / СНАБЖЕНИЕ / B2B
  # ---------------------------------------------------------------------------

  - id: procurement
    pattern: '\b(?:закупаем|закупаю|закупим|планируем\s+закупк\w*|планирую\s+закупк\w*|ведем\s+закупк\w*|идет\s+закупк\w*)\b'
    strong: true

  - id: procurement_need
    pattern: '\b(?:для\s+закупки|на\s+закупку|в\s+закупку)\b'

  - id: supply_needed
    pattern: '\b(?:нужн(?:а|ы)|требуется|требуются|необходим[аы]?)\b(?:\s+\S+){0,3}?\s+(?:поставка|поставки|партия|партии)\b'
    strong: true

  - id: request_for_supply
    pattern: '\b(?:запрос|запрашиваем|прошу|просим)\b(?:\s+\S+){0,3}?\s+(?:поставк\w*|закупк\w*)\b'
    strong: true

  - id: supplier
    pattern: '\b(?:нужен|нужна|нужны|ищу|ищем|подбираю|подбираем|требуется|требуются)\b(?:\s+\S+){0,3}?\s+(?:поставщик\w*|снабженец\w*|продавец\w*)\b'
    strong: true

  - id: supplier_search
    pattern: '\b(?:поиск|подбор)\s+(?:поставщик\w*|продавц\w*)\b'
    strong: true

  - id: supplier_contacts
    pattern: '\b(?:дайте|дайте\s+пожалуйста|скиньте|киньте|пришлите|поделитесь)\b(?:\s+\S+){0,3}?\s+(?:контакт\w*|номер\w*)\b(?:\s+\S+){0,3}?\s+(?:поставщик\w*|продавц\w*|баз\w*|металлобаз\w*)\b'
    strong: true

  # ---------------------------------------------------------------------------
  # 4. "ГДЕ КУПИТЬ / У КОГО / КТО ПРОДАЕТ"
  # ---------------------------------------------------------------------------

  - id: where_buy
    pattern: '\b(?:где|у\s+кого|откуда)\b(?:\s+\S+){0,5}?\s+(?:купить|взять|заказать|приобрести|найти|достать|закупить)\b'
    strong: true

  - id: where_can_buy
    pattern: '\bгде\b(?:\s+\S+){0,3}?\s+(?:можно|реально|лучше)\b(?:\s+\S+){0,2}?\s+(?:купить|взять|заказать|приобрести|найти)\b'
    strong: true

  - id: where_to_get
    pattern: '\b(?:где|у\s+кого)\b(?:\s+\S+){0,4}?\s+(?:достать|раздобыть|забрать)\b'
    strong: true

  - id: who_sells
    pattern: '\bкто\b(?:\s+\S+){0,3}?\s+(?:продает|продаст|возит|привезет|привозит|поставляет|поставит|торгует)\b'
    strong: true

  - id: maybe_who_sells
    pattern: '\b(?:может|может\s+быть)\s+кто(?:-нибудь)?\b(?:\s+\S+){0,3}?\s+(?:продает|продаст|возит|поставляет)\b'
    strong: true

  - id: anyone_has
    pattern: '\b(?:есть\s+(?:ли\s+)?у\s+кого(?:-нибудь|-то)?|у\s+кого(?:-нибудь|-то)?\s+есть|может\s+есть\s+у\s+кого(?:-нибудь|-то)?)\b'
    strong: true

  - id: anyone_can_offer
    pattern: '\bкто(?:-нибудь)?\s+(?:может|сможет)\s+(?:предложить|продать|поставить)\b'
    strong: true

  # ---------------------------------------------------------------------------
  # 5. НАЛИЧИЕ
  # ---------------------------------------------------------------------------

  - id: availability_question
    pattern: '\b(?:есть\s+ли|имеется\s+ли|бывает\s+ли)\b(?:\s+\S+){0,4}?\s+(?:в\s+наличии|на\s+складе)?\b'
    strong: true

  - id: in_stock_question
    pattern: '\b(?:у\s+кого|где)\b(?:\s+\S+){0,4}?\s+(?:есть|имеется)\b(?:\s+\S+){0,3}?\s+(?:в\s+наличии|на\s+складе)\b'
    strong: true

  - id: need_in_stock
    pattern: '\b(?:нужн(?:а|о|ы|ен)|требуется|ищу|ищем)\b(?:\s+\S+){0,5}?\s+(?:в\s+наличии|со\s+склада)\b'

  - id: available_today
    pattern: '\b(?:есть\s+ли|у\s+кого\s+есть)\b(?:\s+\S+){0,5}?\s+(?:сегодня|прямо\s+сейчас|на\s+сегодня)\b'
    strong: true

  # ---------------------------------------------------------------------------
  # 6. ЦЕНА / ПРАЙС / КОММЕРЧЕСКОЕ ПРЕДЛОЖЕНИЕ
  # ---------------------------------------------------------------------------

  - id: price_question
    pattern: '\b(?:сколько\s+стоит|сколько\s+будет\s+стоить|почем|по\s+чем|какая\s+цена|какие\s+цены|во\s+сколько\s+обойдется)\b'

  - id: ask_price
    pattern: '\b(?:подскажите|скажите|напишите|можно|дайте|скиньте|пришлите)\b(?:\s+\S+){0,2}?\s+(?:цену|цены|стоимость|ценник)\b'
    strong: true

  - id: price_for_amount
    pattern: '\b(?:сколько|почем|по\s+чем)\b(?:\s+\S+){0,5}?\s+(?:за\s+тонн\w*|за\s+метр\w*|за\s+штук\w*|за\s+лист\w*)\b'

  - id: price_request
    pattern: '\b(?:интересует|нужна|нужны)\b(?:\s+\S+){0,2}?\s+(?:цена|цены|стоимость)\b'

  - id: price_list_request
    pattern: '\b(?:скиньте|киньте|пришлите|отправьте|дайте|можно)\b(?:\s+\S+){0,2}?\s+(?:прайс|прайс-лист|прайслист)\b'
    strong: true

  - id: quote_request
    pattern: '\b(?:пришлите|отправьте|скиньте|дайте|подготовьте|нужно|нужен|запрашиваю|запрашиваем)\b(?:\s+\S+){0,3}?\s+(?:кп|коммерческ\w+\s+предложени\w*)\b'
    strong: true

  - id: quotation_request
    pattern: '\b(?:запрос\s+цен\w*|запрос\s+котиров\w*|запрос\s+коммерческ\w+\s+предложени\w*)\b'
    strong: true

  - id: best_price
    pattern: '\b(?:где|у\s+кого)\b(?:\s+\S+){0,4}?\s+(?:дешевле|выгоднее|по\s+нормальной\s+цене|по\s+хорошей\s+цене|по\s+адекватной\s+цене)\b'
    strong: true

  # ---------------------------------------------------------------------------
  # 7. РАСЧЕТ / СМЕТА / СЧЕТ / ОПЛАТА
  # ---------------------------------------------------------------------------

  - id: calculation_request
    pattern: '\b(?:посчитайте|рассчитайте|просчитайте|прикиньте|можно\s+посчитать|можно\s+рассчитать)\b(?:\s+\S+){0,4}?\s+(?:стоимость|цену|заказ|поставку|материал\w*|объем\w*)?\b'
    strong: true

  - id: calculation_needed
    pattern: '\b(?:нужен|нужна|нужно)\b(?:\s+\S+){0,2}?\s+(?:расчет|просчет|смета)\b'
    strong: true

  - id: invoice_request
    pattern: '\b(?:выставьте|пришлите|отправьте|скиньте|дайте)\b(?:\s+\S+){0,2}?\s+счет\b'
    strong: true

  - id: invoice_for_payment
    pattern: '\bсчет\s+на\s+оплату\b'
    strong: true

  - id: ready_to_pay
    pattern: '\b(?:готов|готова|готовы)\s+(?:оплатить|внести\s+оплату|перевести\s+деньги)\b'
    strong: true

  - id: payment_question
    pattern: '\b(?:как|куда)\s+(?:оплатить|перевести|внести\s+оплату)\b'
    strong: true

  # ---------------------------------------------------------------------------
  # 8. ДОСТАВКА / САМОВЫВОЗ / СРОКИ
  # ---------------------------------------------------------------------------

  - id: who_can_deliver
    pattern: '\bкто\s+(?:может|сможет|мог\s+бы)\s+(?:привезти|доставить|продать\s+с\s+доставкой|поставить)\b'
    strong: true

  - id: delivery_needed
    pattern: '\b(?:нужн(?:а|о)|требуется|интересует)\b(?:\s+\S+){0,2}?\s+доставк\w*\b'

  - id: delivery_question
    pattern: '\b(?:доставите|привезете|сможете\s+доставить|сможете\s+привезти|можно\s+доставить|можно\s+привезти)\b'
    strong: true

  - id: need_with_delivery
    pattern: '\b(?:нужн(?:а|о|ы|ен)|хочу|хотим|ищу|ищем)\b(?:\s+\S+){0,5}?\s+с\s+доставк\w*\b'
    strong: true

  - id: pickup_question
    pattern: '\b(?:где|откуда)\s+(?:можно\s+)?(?:забрать|забирать|самовывоз)\b'
    strong: true

  - id: ready_pickup
    pattern: '\b(?:заберу|заберем|готов\s+забрать|готова\s+забрать|готовы\s+забрать)\b'
    strong: true

  - id: deadline_need
    pattern: '\b(?:нужн(?:а|о|ы|ен)|требуется|нужно\s+привезти|нужно\s+поставить)\b(?:\s+\S+){0,5}?\s+(?:сегодня|завтра|до\s+\w+|к\s+\w+)\b'

  # ---------------------------------------------------------------------------
  # 9. РЕЗЕРВ / БРОНЬ / ОТЛОЖИТЬ
  # ---------------------------------------------------------------------------

  - id: reserve_request
    pattern: '\b(?:можно|хочу|хотим|нужно)\b(?:\s+\S+){0,2}?\s+(?:забронировать|зарезервировать|отложить)\b'
    strong: true

  - id: reserve_direct
    pattern: '\b(?:забронируйте|зарезервируйте|отложите)\b'
    strong: true

  # ---------------------------------------------------------------------------
  # 10. РЕКОМЕНДАЦИИ / КОНТАКТЫ / "ПОДСКАЖИТЕ"
  # ---------------------------------------------------------------------------

  - id: advise_where
    pattern: '\b(?:подскажите|посоветуйте|подскажете|посоветуете|порекомендуйте)\b(?:\s+пожалуйста)?(?:\s+\S+){0,2}?\s+(?:где|у\s+кого|кто)\b'

  - id: recommend_supplier
    pattern: '\b(?:посоветуйте|порекомендуйте|подскажите)\b(?:\s+\S+){0,3}?\s+(?:поставщик\w*|продавц\w*|компани\w*|фирм\w*|баз\w*|металлобаз\w*)\b'
    strong: true

  - id: recommend_place
    pattern: '\b(?:где\s+лучше\s+брать|где\s+лучше\s+покупать|какую\s+\S+\s+посоветуете|какую\s+\S+\s+порекомендуете)\b'
    strong: true

  - id: contact_request
    pattern: '\b(?:есть\s+контакт|у\s+кого\s+есть\s+контакт|дайте\s+контакт|скиньте\s+контакт|киньте\s+контакт|поделитесь\s+контактом)\b'

  # ---------------------------------------------------------------------------
  # 11. УСЛОВИЯ ЗАКАЗА / ПОСТАВКИ
  # ---------------------------------------------------------------------------

  - id: order_terms
    pattern: '\b(?:какие|подскажите)\b(?:\s+\S+){0,2}?\s+(?:условия\s+заказа|условия\s+поставки|условия\s+оплаты|сроки\s+поставки)\b'

  - id: minimum_order
    pattern: '\b(?:какой|какая|есть\s+ли)\b(?:\s+\S+){0,2}?\s+(?:минимальн\w+\s+заказ|минимальн\w+\s+партия|минимальн\w+\s+объем)\b'

  - id: lead_time
    pattern: '\b(?:сколько\s+ждать|какой\s+срок|какие\s+сроки|за\s+сколько)\b(?:\s+\S+){0,3}?\s+(?:привезете|доставите|поставите|сделаете|изготовите)?\b'

  # ---------------------------------------------------------------------------
  # 12. УСЛУГИ ПО МЕТАЛЛУ: РЕЗКА / ИЗГОТОВЛЕНИЕ / ОБРАБОТКА
  # Сработают как лид только если остальной pipeline найдет релевантный product/context.
  # ---------------------------------------------------------------------------

  - id: cutting_needed
    pattern: '\b(?:нужно|надо|требуется|кто\s+может|кто\s+сможет)\b(?:\s+\S+){0,3}?\s+(?:порезать|нарезать|разрезать|раскроить)\b'
    strong: true

  - id: cutting_service_search
    pattern: '\b(?:где|кто)\b(?:\s+\S+){0,3}?\s+(?:режет|нарежет|порежет|делает\s+резку|делает\s+раскрой)\b'
    strong: true

  - id: fabrication_needed
    pattern: '\b(?:нужно|надо|требуется|хочу|хотим)\b(?:\s+\S+){0,3}?\s+(?:изготовить|сварить|сделать)\b'

  - id: fabrication_search
    pattern: '\b(?:кто|где)\b(?:\s+\S+){0,3}?\s+(?:изготавливает|изготовит|сварит|сделает)\b'

  - id: painting_needed
    pattern: '\b(?:нужно|надо|требуется|кто\s+может|кто\s+сможет)\b(?:\s+\S+){0,3}?\s+(?:покрасить|окрасить|порошков\w+\s+покрасить)\b'

  # ---------------------------------------------------------------------------
  # 13. АЛЬТЕРНАТИВА / ЗАМЕНА / ПОДБОР
  # ---------------------------------------------------------------------------

  - id: alternative_needed
    pattern: '\b(?:нужен|нужна|нужно|ищу|ищем)\b(?:\s+\S+){0,2}?\s+(?:аналог|замена|альтернатива)\b'

  - id: choose_alternative
    pattern: '\b(?:что|чем)\s+(?:можно\s+)?(?:заменить|взять\s+вместо)\b'

  - id: selection_help
    pattern: '\b(?:помогите|подскажите|посоветуйте)\b(?:\s+\S+){0,2}?\s+(?:подобрать|выбрать)\b'

  # ---------------------------------------------------------------------------
  # 14. РАЗГОВОРНЫЕ ФОРМУЛИРОВКИ ДЛЯ ЛОКАЛЬНЫХ ЧАТОВ
  # ---------------------------------------------------------------------------

  - id: folks_where_buy
    pattern: '\b(?:ребят\w*|народ|соседи|мужики|коллеги)\b(?:\s+\S+){0,4}?\s+(?:где\s+купить|где\s+взять|у\s+кого\s+взять|кто\s+продает|кто\s+возит)\b'
    strong: true

  - id: who_knows_where
    pattern: '\bкто\s+знает\b(?:\s+\S+){0,4}?\s+(?:где\s+купить|где\s+взять|где\s+заказать|у\s+кого\s+купить|у\s+кого\s+взять)\b'
    strong: true

  - id: maybe_anyone_has
    pattern: '\b(?:может|вдруг)\b(?:\s+\S+){0,2}?\s+(?:есть\s+у\s+кого|у\s+кого\s+есть)\b'
    strong: true

  - id: looking_to_take
    pattern: '\b(?:ищу|ищем)\b(?:\s+\S+){0,4}?\s+(?:взять|купить|заказать|забрать)\b'
    strong: true

  - id: need_someone_for_supply
    pattern: '\b(?:кто\s+поможет|кто\s+выручит|может\s+кто\s+помочь)\b(?:\s+\S+){0,4}?\s+(?:с\s+поставкой|с\s+покупкой|с\s+доставкой)\b'

  # ---------------------------------------------------------------------------
  # 15. НЕЯВНЫЙ, НО ПОЛЕЗНЫЙ ПОКУПАТЕЛЬСКИЙ ИНТЕРЕС
  # Не strong: должен подтверждаться product / amount / size / location / context.
  # ---------------------------------------------------------------------------

  - id: interested_in
    pattern: '\b(?:интересует|интересуют|интересовался|интересовалась)\b'

  - id: considering_purchase
    pattern: '\b(?:рассматриваю|рассматриваем)\b(?:\s+\S+){0,3}?\s+(?:покупку|закупку|заказ)\b'

  - id: need_offer
    pattern: '\b(?:жду|рассмотрю|готов\s+рассмотреть|готовы\s+рассмотреть)\b(?:\s+\S+){0,3}?\s+(?:предложение|предложения|варианты)\b'

  - id: ask_options
    pattern: '\b(?:что\s+есть|что\s+можете\s+предложить|какие\s+есть\s+варианты)\b'

  - id: ask_assortment
    pattern: '\b(?:есть\s+что-нибудь|что-нибудь\s+есть)\b(?:\s+\S+){0,3}?\s+(?:подходящее|нужное|такое)\b'

  - id: who_can_do_work
    pattern: '\bкто\b(?:\s+\S+){0,3}\s+(?:сделает|смонтирует|установит|подключит|проложит|разведет|проведет|пробурит|обвяжет|починит|отремонтирует|прочистит|заменит)\b'
    strong: true

  - id: who_does_service
    pattern: '\bкто\b(?:\s+\S+){0,3}\s+(?:занимается|делает|монтирует|устанавливает|подключает|ремонтирует|бурит|прочищает)\b'
    strong: true

  - id: recommend_specialist
