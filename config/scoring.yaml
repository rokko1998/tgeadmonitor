weights:
  intent: 5
  intent_strong: 3
  product: 4
  size: 2
  amount: 2
  location: 2
  location_fallback: 0
  context: 1
  project_signal: 4
  professional_actor: 2
  question: 1
  sell: -8
  ad: -5
  many_products: -3
  url: -2

thresholds:
  notify: 8
  project_signal: 6
  potential: 5

hard_rules:
  not_lead:
    - id: seller_with_product
      all: [sell, product]
    - id: seller_without_product
      all: [sell]
  lead:
    - id: strong_buy_intent_with_product
      all: [intent_strong, product]
      none: [sell, ad]
    - id: purchase_intent_with_product
      all: [intent, product]
      none: [sell, ad]
    - id: implicit_request_product_size_question
      all: [product, size, question]
      none: [sell, ad]
    - id: implicit_request_product_amount_question
      all: [product, amount, question]
      none: [sell, ad]
    - id: procurement_specification
      all: [product, size, amount]
      none: [sell, ad]

dedup:
  window_days: 7
  fuzzy_threshold: 92
  same_user_fuzzy_threshold: 82
  max_candidates: 1000
