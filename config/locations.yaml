# Location is descriptive metadata. It never gates monitoring or notifications.
locations:
  - name: Ростов-на-Дону
    patterns: ['\bростов(?:а|е|у|ом)?(?:\s*-?\s*на\s*-?\s*дону)?\b', '\bрнд\b']
  - name: Ростовская область
    patterns: ['\bростовск\w*\s+област\w*\b']
  - name: Аксай
    patterns: ['\bакса[йяею]\b']
  - name: Батайск
    patterns: ['\bбатайск\w*\b']
  - name: Азов
    patterns: ['\bазов(?:а|е|у|ом)?\b']
  - name: Таганрог
    patterns: ['\bтаганрог\w*\b']
  - name: Новочеркасск
    patterns: ['\bновочеркасск\w*\b']
  - name: Левенцовка
    patterns: ['\bлевенцовк\w*\b']
  - name: Краснодар
    patterns: ['\bкраснодар(?:а|е|у|ом)?\b']
  - name: Сочи
    patterns: ['\bсочи\b']
  - name: Анапа
    patterns: ['\bанап\w*\b']
  - name: Крым
    patterns: ['\bкрым\w*\b']
  - name: Ставрополь
    patterns: ['\bставропол\w*\b']
  - name: Москва
    patterns: ['\bмоскв\w*\b']
  - name: Санкт-Петербург
    patterns: ['\bсанкт\s*-?\s*петербург\w*\b', '\bспб\b']
  - name: Казань
    patterns: ['\bказан[ьи]\b']
  - name: Екатеринбург
    patterns: ['\bекатеринбург\w*\b']
