# Эвристики Matcher для извлечения признаков; они не разрешают рассылку.
# Дешёвые отсечения — src/processing/prefilter.py; итоговое решение — Jev.

sell_intents:
  # ---------------------------------------------------------------------------
  # Прямая продажа / предложение товара
  # ---------------------------------------------------------------------------

  - id: sell_direct
    pattern: '\b(?:продаю|продам|продаем|продаём|продается|продаётся|продаются|продажа|распродажа|реализуем|реализую|сбываем|торгуем)\b'

  - id: offer_for_sale
    pattern: '\b(?:предлагаем|предлагаю)\s+(?:к\s+продаже|металлопрокат|арматур\w*|труб\w*|лист\w*|швеллер\w*|уголок\w*|балк\w*|сетк\w*|проволок\w*)'

  - id: supply_offer
    pattern: '\b(?:поставляем|поставляю|поставим|готовы\s+поставить|осуществляем\s+поставк\w*|организуем\s+поставк\w*|предлагаем\s+поставк\w*)\b'

  - id: shipment_offer
    pattern: '\b(?:отгружаем|отгрузим|отпускаем|отпустим)\b|\b(?:ежедневн\w+\s+)?отгрузк\w+\s+(?:со\s+склада|со\s+складов)\b'

  - id: dealer_offer
    pattern: '\b(?:официальн\w+\s+дилер|дилерск\w+\s+цен\w*|дилерск\w+\s+услови\w*)\b'


  # ---------------------------------------------------------------------------
  # Продавец как компания / база / склад / производитель
  # ---------------------------------------------------------------------------

  - id: company
    pattern: '\bнаш[аи]?\s+(?:компани\w*|склад\w*|фирм\w*|магазин\w*|баз[аеы]|металлобаз\w*)\b|^металлобаз\w*\b|^торгов\w+\s+дом\b'

  - id: seller_identity
    pattern: '\b(?:мы|являемся)\s+(?:производител\w*|поставщик\w*|дилер\w*|дистрибьютор\w*)\b'

  - id: own_production
    pattern: '\b(?:собственн\w+|сво[её])\s+производств\w*\b|\bпроизводим\s+(?:сами|на\s+сво[её]м\s+производств\w*)\b'

  - id: warehouse_identity
    pattern: '\b(?:наш|собственн\w+)\s+склад\b|\bсклад\s+металлопрокат\w*\b|\bметалл\s+с\s+нашего\s+склада\b'

  - id: stable_stock
    pattern: '\b(?:всегда|постоянно)\s+в\s+наличии\b|\bв\s+наличии\s+на\s+наш\w+\s+склад\w*\b|\bподдерживаем\s+в\s+наличии\b'

  - id: warehouse_residue
    pattern: '\b(?:распродаем|распродаём|реализуем|ликвидаци\w+)\s+(?:складск\w+\s+)?остатк\w*\b'


  # ---------------------------------------------------------------------------
  # Опт / розница / коммерческий формат именно продавца
  # ---------------------------------------------------------------------------

  - id: wholesale_retail_sales
    pattern: '\b(?:продажа|продаем|продаём|реализуем)\s+(?:оптом|в\s+розницу)\b|\bопт\w*\s*(?:и|/)\s*(?:в\s+)?розниц\w*\b|\bоптов\w+\s+и\s+розничн\w+\s+продаж\w*\b'

  - id: wholesale_prices
    pattern: '\b(?:оптов\w+|розничн\w+|дилерск\w+)\s+цен\w*\b|\bцен\w+\s+для\s+(?:оптовик\w*|дилер\w*)\b'

  - id: price_list
    pattern: '\b(?:(?:скину|отправлю|высылаем|направим)\s+прайс\w*|прайс\s+в\s+(?:лс|личку))\b'

  - id: manufacturer_ad
    pattern: '\bот\s+производител\w*\b|\bприглашаем\s+к\s+сотрудничеств\w*\b'

  - id: seller_price_from
    pattern: '\b(?:цена|стоимость)\s+от\s+\d[\d\s]*(?:[.,]\d+)?\s*(?:₽|руб(?:\.|лей|ля)?|р\.)\b'

  - id: seller_unit_price
    pattern: '\b\d[\d\s]*(?:[.,]\d+)?\s*(?:₽|руб(?:\.|лей|ля)?|р\.)\s*(?:/|за)\s*(?:т|тонн\w*|кг|м|метр\w*|п\.?\s*м\.?|шт\w*|лист\w*)\b'


  # ---------------------------------------------------------------------------
  # Заказы / CTA / акции
  # ---------------------------------------------------------------------------

  - id: order_acceptance
    pattern: '\b(?:принимаем|оформляем)\s+заказ\w*\b|\bзаказ\w*\s+(?:принимаем|оформляем)\b|\bдля\s+заказа\s+(?:звоните|пишите|обращайтесь)\b'

  - id: sales_cta
    pattern: '\b(?:заказывайте|покупайте|успейте\s+заказать|оформляйте\s+заказ)\b|\b(?:звоните|пишите)\s+(?:для|по\s+вопросам)\s+(?:заказа|покупки|приобретения)\b'

  - id: contact_for_orders
    pattern: '\b(?:телефон|номер)\s+(?:для\s+)?заказ\w*\b|\bзаказ\w*\s+по\s+(?:телефону|номеру|whatsapp|ватсап\w*|telegram|телеграм\w*)\b'

  - id: promo
    pattern: '\b(?:акци[яи]|скидк\w*|спецпредложени\w*|специальн\w+\s+цен\w*|ликвидаци\w+\s+остатк\w*|распродаж\w*)\b'

  - id: urgency_promo
    pattern: '\b(?:только\s+сегодня|до\s+конца\s+недели|количество\s+ограничено|успейте\s+заказать|последн\w+\s+по\s+этой\s+цене)\b'

  - id: bonus_promo
    pattern: '\b(?:бесплатн\w+\s+доставк\w+\s+при\s+заказе|подарок\s+при\s+заказе|скидк\w+\s+при\s+заказе|цена\s+по\s+акции)\b'


  # ---------------------------------------------------------------------------
  # Доставка / логистика со стороны продавца
  # ---------------------------------------------------------------------------

  - id: seller_delivery
    pattern: '\b(?:доставим|доставляем|привезем|привезём|привозим)\b|\bосуществляем\s+доставк\w*\b|\b(?:своя|собственн\w+)\s+доставк\w*\b'

  - id: seller_loading
    pattern: '\b(?:погрузим|грузим)\b|\bпогрузк\w+\s+(?:бесплатн\w*|включен\w*|краном)\b'

  - id: seller_pickup
    pattern: '\bсамовывоз\s+(?:с\s+нашего|со\s+склада|с\s+базы)\b'


  # ---------------------------------------------------------------------------
  # Производство / металлообработка / подрядчик рекламирует услуги
  # ---------------------------------------------------------------------------

  - id: services_general
    pattern: '\b(?:выполним|изготовим|изготавливаем)\b|\bоказываем\s+услуг\w*\b|\bработаем\s+под\s+ключ\b|\bвыезд\s+замерщика\b'

  - id: metal_processing_offer
    pattern: '\b(?:режем|нарежем|порежем)\s+(?:металл\w*|лист\w*|труб\w*|профил\w*)\b|\b(?:гнем|гн[её]м|сварим|варим|покрасим|красим|оцинкуем)\s+(?:металл\w*|конструкци\w*|издели\w*)\b'

  - id: cutting_services_offer
    pattern: '\b(?:предлагаем|выполняем|оказываем)\s+(?:лазерн\w+|плазменн\w+|газов\w+|гильотинн\w+)\s+резк\w*\b|\b(?:лазерн\w+|плазменн\w+)\s+резк\w+\s+на\s+заказ\b'

  - id: fabrication_offer
    pattern: '\b(?:изготовим|изготавливаем|производим)\s+(?:металлоконструкци\w*|закладн\w*|ферм\w*|лестниц\w*|навес\w*|ворот\w*|каркас\w*)\b'

  - id: custom_manufacturing
    pattern: '\b(?:изготавливаем|делаем|производим)\s+под\s+заказ\b|\b(?:изготавливаем|делаем|производим)\s+по\s+(?:вашим\s+)?(?:размерам|чертежам|чертежу|эскизам|эскизу)\b'

  - id: contractor_offer
    pattern: '\b(?:бригада|мастер|сварщик|монтажник)\s+(?:выполнит|выполняет|предлагает)\b|\b(?:строим|монтируем|устанавливаем)\s+(?:забор\w*|навес\w*|ворот\w*|каркас\w*)\b'

  - id: free_estimate_offer
    pattern: '\b(?:бесплатн\w+\s+замер\s+при\s+заказе|выезд\s+замерщика\s+бесплатн\w*|расч[её]т\s+стоимости\s+бесплатн\w*)\b'


  # ---------------------------------------------------------------------------
  # Формулировки продавца "кому нужно"
  # ---------------------------------------------------------------------------

  - id: seller_asks
    pattern: '\bкому\s+(?:нужн\w*|интересн\w*)\s+(?:металл\w*|арматур\w*|труб\w*|лист\w*|швеллер\w*|уголок\w*|сетк\w*|проволок\w*)\b'

  - id: available_offer
    pattern: '\bесть\s+(?:арматур\w*|труб\w*|лист\w*|швеллер\w*|уголок\w*|металл\w*)\s+(?:на\s+продажу|по\s+хорошей\s+цене|на\s+реализацию)\b'


  # ---------------------------------------------------------------------------
  # Металлолом / вторсырьё — похожая лексика, но не целевой покупатель проката
  # ---------------------------------------------------------------------------

  - id: scrap_market
    pattern: '\b(?:при[её]м|принимаем|закупаем|купим|покупаем|скупаем)\s+(?:черн\w+\s+|цветн\w+\s+)?(?:металлолом\w*|лом\w+)\b|\bпункт\s+при[её]ма\s+(?:металл\w*|лом\w*)\b'

  - id: scrap_price
    pattern: '\b(?:металлолом|лом)\b.{0,40}\b(?:цен\w*|руб(?:лей)?\s+за\s+кг|за\s+тонн\w*)\b'

  - id: scrap_removal
    pattern: '\b(?:вывозим|заберем|заберём)\s+(?:металлолом|лом)\b|\bдемонтаж\s+и\s+вывоз\s+(?:металл\w*|лом\w*)\b'


  # ---------------------------------------------------------------------------
  # Нерелевантные покупки, которые могут случайно набрать intent + location + context
  # ---------------------------------------------------------------------------

  - id: unrelated_real_estate
    pattern: '\b(?:куплю|покупаю|ищу|сниму|арендую)\s+(?:гараж\w*|квартир\w*|комнат\w*|дом\b|дач\w*|участок\w*|земл\w*|помещени\w*)\b'

  - id: unrelated_vehicle
    pattern: '\b(?:куплю|покупаю|ищу)\s+(?:авто\b|автомобил\w*|машин\w*|мотоцикл\w*|скутер\w*|велосипед\w*|трактор\w*|прицеп\w*)\b'

  - id: unrelated_rental
    pattern: '\b(?:сниму|ищу)\s+(?:гараж\w*|квартир\w*|комнат\w*|дом\b|дач\w*|помещени\w*)\b|\bищу\s+жиль[её]\b'


  # ---------------------------------------------------------------------------
  # Вакансии / найм со стороны работодателя
  # ---------------------------------------------------------------------------

  - id: jobs
    pattern: '\b(?:требуется|требуются|ищем|набираем)\s+(?:сварщик|рабоч|разнорабоч|монтажник|водител|менеджер|грузчик|сотрудник|бригад|кладовщик|оператор|мастер|прораб|слесар|токар|резчик|электрик)\w*'

  - id: vacancy
    pattern: '\b(?:ваканси\w*|набираем\s+(?:сотрудник\w*|персонал\w*|рабоч\w*)|приглашаем\s+на\s+работу|требуются\s+сотрудник\w*)\b'

  - id: job_conditions
    pattern: '\b(?:зарплата|з/?п)\s+(?:от\s+)?\d[\d\s]*\b.{0,80}\b(?:график|смен\w*|вахт\w*|оформлени\w*)\b'


# =============================================================================
# ПРИЗНАКИ РЕКЛАМЫ ДЛЯ METADATA
# =============================================================================
# Итоговая фильтрация реализована в prefilter.py и semantic_policy.py.
# Эти признаки не разрешают и не запрещают рассылку.
ad_features:
  min_features: 2

  # 4+ разных товарных групп — сильный признак каталога/прайса.
  many_products_threshold: 4

  # 2+ цены в одном сообщении — сильный признак рекламного объявления.
  price_count_threshold: 2

  # Отдельный emoji не страшен; рекламные посты обычно используют их пачками.
  emoji_threshold: 5

  # CAPS включается только для достаточно длинного текста,
  # чтобы короткое "КУПЛЮ ТРУБУ" не считалось рекламой.
  caps_ratio_threshold: 0.5
  caps_min_letters: 20
